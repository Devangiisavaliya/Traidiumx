<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />

    <title>Blog Details | TraidiumX</title>

    <!-- Tailwind Output CSS -->
    <link rel="stylesheet" href="../../dist/output.css" />

    <!-- Custom CSS -->
    <link rel="stylesheet" href="../css/custom.css" />
    <link rel="stylesheet" href="../css/animations.css" />
    <link rel="stylesheet" href="../css/responsive.css" />
</head>

<body class="bg-[#020617] text-white" data-page="blog">

    <!-- Reusable Navbar -->
    <div data-component="navbar"></div>

    <!-- ================= MAIN START ================= -->
    <main class="overflow-hidden pt-32">

        <section class="relative">
            <div class="absolute inset-0 -z-10">
                <div class="absolute left-0 top-0 h-96 w-96 rounded-full bg-cyan-500/20 blur-[120px]"></div>
                <div class="absolute right-0 top-36 h-96 w-96 rounded-full bg-blue-600/20 blur-[120px]"></div>
            </div>

            <div class="mx-auto max-w-5xl px-4 py-12 sm:px-6 lg:px-8">

                <a href="./blog.html" class="mb-8 inline-flex rounded-full border border-white/10 px-5 py-3 text-sm font-black text-white hover:border-cyan-400 hover:text-cyan-400">
                    ← Back to Blog
                </a>

                <article id="blogDetailsArticle" class="rounded-[2.5rem] border border-white/10 bg-white/[0.05] p-6 backdrop-blur-xl sm:p-10"></article>

                <div class="mt-10 grid gap-6 lg:grid-cols-2">
                    <div class="rounded-[2rem] border border-cyan-400/20 bg-cyan-400/[0.06] p-6">
                        <h3 class="text-2xl font-black">Start trading smarter</h3>

                        <p class="mt-3 leading-7 text-slate-400">
                            Explore futures and options tools after learning the basics.
                        </p>

                        <div class="mt-6 flex flex-col gap-3 sm:flex-row">
                            <a href="./futures.html" class="rounded-full bg-cyan-400 px-6 py-3 text-center text-sm font-black text-slate-950 hover:bg-cyan-300">
                                Open Futures
                            </a>

                            <a href="./options.html" class="rounded-full border border-white/10 px-6 py-3 text-center text-sm font-black text-white hover:border-cyan-400 hover:text-cyan-400">
                                Open Options
                            </a>
                        </div>
                    </div>

                    <div class="rounded-[2rem] border border-white/10 bg-white/[0.05] p-6">
                        <h3 class="text-2xl font-black">Related Posts</h3>

                        <div id="relatedPostsList" class="mt-5 space-y-3"></div>
                    </div>
                </div>

            </div>
        </section>

    </main>
    <!-- ================= MAIN END ================= -->

    <!-- Reusable Footer -->
    <div data-component="footer"></div>

    <!-- JavaScript -->
    <script src="../js/components-loader.js"></script>
    <script src="../js/api-config.js"></script>
    <script src="../js/auth-state.js"></script>
    <script src="../js/blog-details.js"></script>
    <script src="../js/responsive.js"></script>
</body>
</html>
