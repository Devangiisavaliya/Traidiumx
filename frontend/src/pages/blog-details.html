<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />

    <title>Blog Details | TraidiumX</title>

    <script>
        document.documentElement.classList.add("tx-motion-ready");
    </script>

    <!-- Tailwind Output CSS -->
    <link rel="stylesheet" href="../../dist/output.css" />

    <!-- Custom CSS -->
    <link rel="stylesheet" href="../css/custom.css" />
    <link rel="stylesheet" href="../css/animations.css" />
    <link rel="stylesheet" href="../css/responsive.css" />
    <style>
        /* Lenis Smooth Scroll Configuration */
        html.lenis, html.lenis body {
            height: auto;
        }
        .lenis.lenis-smooth {
            scroll-behavior: auto !important;
        }
        .lenis.lenis-smooth [data-lenis-prevent] {
            overscroll-behavior: contain;
        }
        .lenis.lenis-stopped {
            overflow: hidden;
        }
        .lenis.lenis-smooth iframe {
            pointer-events: none;
        }
    </style>
    <link rel="icon" type="image/png" href="../../assets/logo.png" />
</head>

<body class="bg-[#020617] text-white" data-page="blog">

    <!-- Reusable Navbar -->
    <div data-component="navbar"></div>

    <!-- ================= MAIN START ================= -->
    <main class="overflow-hidden pt-32">

        <section class="relative tx-scroll-reveal" data-reveal-delay="50">
            <div class="absolute inset-0 -z-10">
                <div class="absolute left-0 top-0 h-96 w-96 rounded-full bg-cyan-500/20 blur-[120px]"></div>
                <div class="absolute right-0 top-36 h-96 w-96 rounded-full bg-blue-600/20 blur-[120px]"></div>
            </div>

            <div class="mx-auto max-w-5xl px-4 py-12 sm:px-6 lg:px-8">

                <a href="./blog.html" class="mb-8 inline-flex rounded-full border border-white/10 px-5 py-3 text-sm font-black text-white hover:border-cyan-400 hover:text-cyan-400">
                    ← Back to Blog
                </a>

                <article id="blogDetailsArticle" class="rounded-[2.5rem] border border-white/10 bg-white/[0.05] p-6 backdrop-blur-xl sm:p-10"></article>

            </div>
        </section>

    </main>
    <!-- ================= MAIN END ================= -->

    <!-- Reusable Footer -->
    <div data-component="footer"></div>

    <!-- JavaScript -->
    <script src="../js/lenis.min.js"></script>
    <script>
        (function() {
            if (typeof Lenis !== "undefined") {
                const lenis = new Lenis({
                    duration: 1.15,
                    easing: (t) => Math.min(1, 1.001 - Math.pow(2, -10 * t)),
                    direction: "vertical",
                    gestureDirection: "vertical",
                    smooth: true,
                    smoothTouch: false,
                    touchMultiplier: 1.5,
                    wheelMultiplier: 1.05
                });

                function raf(time) {
                    lenis.raf(time);
                    requestAnimationFrame(raf);
                }

                requestAnimationFrame(raf);
                window.txLenis = lenis;

                document.addEventListener("click", function(e) {
                    const link = e.target.closest('a[href^="#"]');
                    if (!link) return;
                    const href = link.getAttribute("href");
                    if (href && href !== "#" && href.length > 1) {
                        const target = document.querySelector(href);
                        if (target) {
                            e.preventDefault();
                            lenis.scrollTo(target, { offset: -90, duration: 1.2 });
                        }
                    }
                });
            }
        })();

        document.addEventListener("DOMContentLoaded", function () {
            const revealItems = Array.from(document.querySelectorAll(".tx-scroll-reveal"));
            revealItems.forEach(function (item) {
                const delay = Number(item.getAttribute("data-reveal-delay") || 0);
                item.style.setProperty("--tx-reveal-delay", delay + "ms");
            });

            function showRevealItem(item) {
                window.requestAnimationFrame(function () {
                    item.classList.add("is-visible");
                });
            }

            if ("IntersectionObserver" in window) {
                const revealObserver = new IntersectionObserver(function (entries, observer) {
                    entries.forEach(function (entry) {
                        if (!entry.isIntersecting) return;
                        showRevealItem(entry.target);
                        observer.unobserve(entry.target);
                    });
                }, {
                    threshold: 0.08,
                    rootMargin: "0px 0px -35px 0px"
                });

                revealItems.forEach(function (item) {
                    revealObserver.observe(item);
                });
            } else {
                revealItems.forEach(showRevealItem);
            }
        });
    </script>
    <script src="../js/components-loader.js"></script>
    <script src="../js/api-config.js"></script>
    <script src="../js/auth-state.js"></script>
    <script src="../js/blog-details.js"></script>
    <script src="../js/responsive.js"></script>
</body>
</html>
