<header class="tx-pill-header fixed left-0 top-0 z-50 w-full px-4 pt-4 sm:px-6 lg:px-8">
    <script>
        (function() {
            const header = document.querySelector('.tx-pill-header');
            if (!header) return;
            function handleScroll() {
                const scrollTop = window.scrollY || window.pageYOffset || document.documentElement.scrollTop || document.body.scrollTop || 0;
                if (scrollTop > 20) {
                    header.classList.add('tx-navbar-scrolled');
                } else {
                    header.classList.remove('tx-navbar-scrolled');
                }
            }
            window.removeEventListener('scroll', window.__txNavbarScrollHandler);
            window.__txNavbarScrollHandler = handleScroll;
            window.addEventListener('scroll', handleScroll, { passive: true });
            handleScroll();
        })();
    </script>
