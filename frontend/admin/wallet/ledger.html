<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<script>
    window.tailwind = { config: { theme: { extend: { fontFamily: { sans: ['Inter', 'ui-sans-serif', 'system-ui'] } } } } };
</script>
<script src="https://cdn.tailwindcss.com"></script>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&display=swap" rel="stylesheet">
<link rel="stylesheet" href="/admin/static/css/admin-base.css" />
<link rel="icon" type="image/png" href="../../assets/logo.png" />
<title>Wallet Ledger | TraidiumX Admin</title>
</head>
<body data-admin-page="ledger" data-page-title="Wallet Ledger" data-page-subtitle="Audit-ready wallet movement history with server-side pagination.">
    <div class="admin-shell">
        <aside id="adminSidebar" class="admin-sidebar"></aside>
        <div id="adminBackdrop" class="admin-backdrop"></div>
        <section class="admin-main">
            <header id="adminTopbar" class="admin-topbar"></header>
            <main class="admin-content">
<section class="space-y-5">
    <div class="grid gap-4 md:grid-cols-2 xl:grid-cols-4">
        <div class="admin-card p-5 tx-fade-up"><p class="text-sm font-bold text-slate-400">Total Wallet Balance</p><h3 id="ledgerTotalBalance" class="mt-2 text-3xl font-black text-white">$0</h3></div>
        <div class="admin-card p-5 tx-fade-up tx-delay-1"><p class="text-sm font-bold text-slate-400">Available Balance</p><h3 id="ledgerAvailableBalance" class="mt-2 text-3xl font-black text-emerald-300">$0</h3></div>
        <div class="admin-card p-5 tx-fade-up tx-delay-2"><p class="text-sm font-bold text-slate-400">Locked Balance</p><h3 id="ledgerLockedBalance" class="mt-2 text-3xl font-black text-amber-300">$0</h3></div>
        <div class="admin-card p-5 tx-fade-up tx-delay-3"><p class="text-sm font-bold text-slate-400">Today Debit</p><h3 id="ledgerTodayDebit" class="mt-2 text-3xl font-black text-rose-300">$0</h3></div>
    </div>

    <div class="admin-card p-5 tx-fade-up tx-delay-1">
        <div class="mb-5 flex flex-wrap items-start justify-between gap-3">
            <div><h2 class="text-xl font-black text-white">Wallet Ledger</h2><p class="mt-1 text-sm text-slate-400">Search by user, reference, transaction type or description.</p></div>
        </div>
        <div class="grid gap-3 xl:grid-cols-[1.45fr_0.8fr_0.8fr_0.8fr_auto_auto]">
            <input id="ledgerSearch" class="admin-input" placeholder="Search user, reference, type..." />
            <select id="ledgerCurrencyFilter" class="admin-input"><option value="all">All currencies</option><option value="INR">INR (₹)</option><option value="USDT">USDT ($)</option></select>
            <select id="ledgerTypeFilter" class="admin-input"><option value="all">All types</option><option value="deposit">Deposit</option><option value="withdrawal">Withdrawal</option><option value="withdrawal_rejected_release">Rejected release</option><option value="trade">Trade</option><option value="internal_transfer">Internal Transfer</option></select>
            <select id="ledgerDirectionFilter" class="admin-input"><option value="all">All directions</option><option value="credit">Credit</option><option value="debit">Debit</option></select>
            <button id="ledgerResetBtn" class="admin-btn">Reset</button>
            <button id="ledgerExportBtn" class="admin-btn admin-btn-primary">Export CSV</button>
        </div>
        <div class="mt-5 table-wrap">
            <table class="admin-table"><thead><tr><th>User</th><th>Type</th><th>Direction</th><th>Amount</th><th>Balance</th><th>Reference</th><th>Date</th></tr></thead><tbody id="ledgerTableBody"></tbody></table>
        </div>
        <div id="ledgerPagination" class="mt-5"></div>
    </div>
</section>
            </main>
        </section>
    </div>
<script src="/admin/static/js/admin-config.js"></script>
<script src="/admin/static/js/admin-api.js"></script>
<script src="/admin/static/js/admin-data.js"></script>
<script src="/admin/static/js/admin-layout.js"></script>
<script src="/admin/static/js/admin-wallet.js"></script>
</body>
</html>
